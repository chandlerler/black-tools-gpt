name: Build Windows desktop app
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: MuHei-${{ matrix.runtime }}
          path: artifacts/MuHei-${{ matrix.runtime }}.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MuHei-*
          path: release-assets
          merge-multiple: true
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum release-assets/*.zip > release-assets/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "幕黑 $RELEASE_TAG" --notes-file RELEASE_NOTES.md
